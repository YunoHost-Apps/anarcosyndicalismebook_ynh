# GitLab CI - Auto-update du checksum SHA256
# Se déclenche automatiquement ou manuellement

stages:
  - update

variables:
  MANIFEST_FILE: "manifest.toml"

update_checksum:
  stage: update
  image: alpine:latest
  # Déclencher sur push, manuellement, ou via webhook/schedule
  rules:
    - if: $CI_COMMIT_BRANCH == "main"       # Sur chaque push vers main
    - if: $CI_PIPELINE_SOURCE == "web"      # Bouton "Run pipeline" dans GitLab
    - if: $CI_PIPELINE_SOURCE == "trigger"  # Via API/webhook
    - if: $CI_PIPELINE_SOURCE == "schedule" # Via schedule programmé
  before_script:
    - apk add --no-cache curl git sed
    - git config --global user.email "ci@gitlab.com"
    - git config --global user.name "GitLab CI"
  script:
    - echo "📥 Lecture de l'URL de source depuis ${MANIFEST_FILE}..."
    - SOURCE_URL=$(awk '/^\[resources\.sources\.main\]/ { in_main=1; next } /^\[/ { in_main=0 } in_main && $1 == "url" { gsub(/"/, "", $3); print $3; exit }' "$MANIFEST_FILE")
    - OLD_SHA=$(awk '/^\[resources\.sources\.main\]/ { in_main=1; next } /^\[/ { in_main=0 } in_main && $1 == "sha256" { gsub(/"/, "", $3); print $3; exit }' "$MANIFEST_FILE")
    - test -n "$SOURCE_URL"
    - test -n "$OLD_SHA"
    - echo "📥 Téléchargement et calcul du checksum..."
    - NEW_SHA=$(curl -sL "$SOURCE_URL" | sha256sum | cut -d' ' -f1)
    - echo "Ancien SHA256 = $OLD_SHA"
    - echo "Nouveau SHA256 = $NEW_SHA"
    - |
      if [ "$NEW_SHA" != "$OLD_SHA" ]; then
        echo "🔄 Mise à jour du manifest..."
        sed -i "s/sha256 = \"$OLD_SHA\"/sha256 = \"$NEW_SHA\"/" "$MANIFEST_FILE"
        git add "$MANIFEST_FILE"
        git commit -m "🔄 Auto-update source checksum"
        if [ -z "$CI_PUSH_TOKEN" ]; then
          echo "❌ Erreur: La variable CI_PUSH_TOKEN est vide !"
          exit 1
        fi
        git remote set-url origin "https://token:${CI_PUSH_TOKEN}@gitlab.com/${CI_PROJECT_PATH}.git"
        git push origin HEAD:main
        echo "✅ Checksum mis à jour et poussé !"
      else
        echo "✅ Checksum déjà à jour, rien à faire."
      fi
