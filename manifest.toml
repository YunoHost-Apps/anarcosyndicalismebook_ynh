#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "anarchosyndicalismebook"
name = "AnarcosyndicalismeBOOK"
description.en = "Digital library CMS for sharing texts, PDFs and EPUBs"
description.fr = "CMS de bibliothèque numérique pour partager textes, PDF et EPUB"

version = "1.3.0~ynh1"

maintainers = ["YunoHost Community"]

[upstream]
license = "MIT"
website = "https://codeberg.org/Anarcosyndicalismebook/anarcosyndicalismebook"
code = "https://codeberg.org/Anarcosyndicalismebook/anarcosyndicalismebook"
admindoc = "https://codeberg.org/Anarcosyndicalismebook/anarcosyndicalismebook/src/branch/main/README.md"

[integration]
yunohost = ">= 11.2.30"
helpers_version = "2.1"
architectures = "all"
multi_instance = true
ldap = false
sso = false
disk = "100M"
ram.build = "256M"
ram.runtime = "128M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

    [install.admin]
    type = "user"

    [install.admin_password]
    type = "password"

    [install.cap_url]
    type = "string"
    ask.en = "CAP Instance URL (e.g., http://127.0.0.1:3000 or https://cap.domain.org - optional)"
    ask.fr = "URL de l'instance CAP (ex: http://127.0.0.1:3000 ou https://cap.domaine.org - facultatif)"
    default = "http://127.0.0.1:3000"
    optional = true

    [install.cap_site_key]
    type = "string"
    ask.en = "CAP Site Key (optional)"
    ask.fr = "Clé de site CAP (facultatif)"
    optional = true

    [install.cap_secret_key]
    type = "string"
    ask.en = "CAP Secret Key (optional)"
    ask.fr = "Clé secrète CAP (facultatif)"
    optional = true

    [install.smtp_host]
    type = "string"
    ask.en = "SMTP Host"
    ask.fr = "Serveur SMTP"
    default = "127.0.0.1"

    [install.smtp_port]
    type = "string"
    ask.en = "SMTP Port"
    ask.fr = "Port SMTP"
    default = "25"
    [install.contact_email]
    type = "email"
    ask.en = "Contact Email (recipient)"
    ask.fr = "Email de contact (destinataire)"
    example = "contact@example.com"
    default = ""
    [install.smtp_user]
    type = "string"
    ask.en = "SMTP User (email address for sending)"
    ask.fr = "Utilisateur SMTP (adresse email pour l'envoi)"
    example = "contact@yourdomain.org"
    help.en = "Email address used to send contact form messages"
    help.fr = "Adresse email utilisée pour envoyer les messages du formulaire de contact"

    [install.smtp_password]
    type = "password"
    ask.en = "SMTP Password"
    ask.fr = "Mot de passe SMTP"
    help.en = "Password for the SMTP email account"
    help.fr = "Mot de passe du compte email SMTP"

[resources]
    [resources.sources.main]
    url = "https://codeberg.org/Anarcosyndicalismebook/anarcosyndicalismebook/archive/v1.3.0-beta.2.tar.gz"
    sha256 = "26e5ece46c3b26a436c229fbc0db10953585a69b59ead5b7d9e73465fcf62da9"
    autoupdate.strategy = "latest_gitea_tag"
    autoupdate.upstream = "https://codeberg.org/Anarcosyndicalismebook/anarcosyndicalismebook"

    [resources.system_user]

    [resources.install_dir]

    [resources.data_dir]

    [resources.permissions]
    main.url = "/"
    admin.url = "/admin"
    admin.allowed = "admins"

    [resources.apt]
    packages = "git, mariadb-server, php-cli, php-fpm, php-mysql, php-curl, php-mbstring, php-sqlite3, php-xml, php-gd, php-zip"

    [resources.database]
    type = "mysql"
