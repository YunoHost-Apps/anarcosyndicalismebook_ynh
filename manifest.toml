#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "anarcosyndicalismebook"
name = "AnarcosyndicalismeBOOK"
description.en = "Digital library CMS for sharing texts, PDFs and EPUBs"
description.fr = "CMS de bibliothèque numérique pour partager textes, PDF et EPUB"

version = "1.3.1~ynh21"

maintainers = ["AnARCHIS12"]

[upstream]
license = "MIT"
website = "https://anarcosyndicalismebookcms.unionlibertaireanarchiste.org"
code = "https://codeberg.org/Anarcosyndicalismebook/anarcosyndicalismebook"
admindoc = "https://codeberg.org/Anarcosyndicalismebook/anarcosyndicalismebook/src/branch/main/README.md"

[integration]
yunohost = ">= 11.2.30"
helpers_version = "2.1"
architectures = "all"
multi_instance = true
ldap = false
sso = false
disk = "100M"
ram.build = "256M"
ram.runtime = "128M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

    [install.admin]
    type = "user"

    [install.admin_password]
    type = "password"
    ask.en = "Application administrator password (minimum 8 characters)"
    ask.fr = "Mot de passe administrateur de l’application (8 caractères minimum)"
    help.en = "This password is used to access the application administrator account (minimum 8 characters)."
    help.fr = "Ce mot de passe sert à accéder au compte administrateur de l’application (8 caractères minimum)."

    [install.cap_url]
    type = "string"
    ask.en = "CAP Instance URL (e.g., http://127.0.0.1:3000 or https://cap.domain.org - optional)"
    ask.fr = "URL de l'instance CAP (ex: http://127.0.0.1:3000 ou https://cap.domaine.org - facultatif)"
    default = "http://127.0.0.1:3000"
    optional = true

    [install.cap_site_key]
    type = "string"
    ask.en = "CAP Site Key (optional)"
    ask.fr = "Clé de site CAP (facultatif)"
    optional = true
    default = ""

    [install.cap_secret_key]
    type = "string"
    ask.en = "CAP Secret Key (optional)"
    ask.fr = "Clé secrète CAP (facultatif)"
    optional = true
    default = ""

    [install.smtp_host]
    type = "string"
    ask.en = "SMTP Host"
    ask.fr = "Serveur SMTP"
    default = "127.0.0.1"

    [install.smtp_port]
    type = "string"
    ask.en = "SMTP Port"
    ask.fr = "Port SMTP"
    default = "25"

    [install.contact_email]
    type = "email"
    ask.en = "Contact Email (recipient - optional)"
    ask.fr = "Email de contact (destinataire - facultatif)"
    example = "contact@example.com"
    optional = true

    [install.smtp_user]
    type = "string"
    ask.en = "SMTP User (email address for sending - optional)"
    ask.fr = "Utilisateur SMTP (adresse email pour l'envoi - facultatif)"
    example = "contact@yourdomain.org"
    help.en = "Email address used to send contact form messages"
    help.fr = "Adresse email utilisée pour envoyer les messages du formulaire de contact"
    optional = true
    default = ""

    [install.smtp_password]
    type = "password"
    ask.en = "SMTP Password (optional)"
    ask.fr = "Mot de passe SMTP (facultatif)"
    help.en = "Password for the SMTP email account"
    help.fr = "Mot de passe du compte email SMTP"
    optional = true
    default = ""

[resources]
    [resources.sources.main]
    url = "https://codeberg.org/Anarcosyndicalismebook/anarcosyndicalismebook/archive/d5a2bbdd82ff465842d626f26ba58de34c4b1608.tar.gz"
    sha256 = "be58dab3d6c5a17a6713f477c087b5aa7e4e6ed9daa72ac5fb55b468669a3040"

    [resources.system_user]

    [resources.install_dir]

    [resources.data_dir]

    [resources.permissions]
    main.url = "/"
    admin.url = "/admin"
    admin.allowed = "admins"

    [resources.apt]
    packages = "git, mariadb-server, php8.4-cli, php8.4-fpm, php8.4-mysql, php8.4-curl, php8.4-mbstring, php8.4-sqlite3, php8.4-xml, php8.4-gd, php8.4-zip, php8.4-intl, php8.4-opcache"

    [resources.database]
    type = "mysql"
