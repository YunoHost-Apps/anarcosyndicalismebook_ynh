#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "anarchosyndicalismebook"
name = "AnarcosyndicalismeBOOK"
description.en = "Digital library CMS for sharing texts, PDFs and EPUBs"
description.fr = "CMS de bibliothèque numérique pour partager textes, PDF et EPUB"

version = "1.0.0~ynh1"

maintainers = ["YunoHost Community"]

[upstream]
license = "MIT"
website = "https://gitlab.com/anarchymedialibertaire-group/anarcosyndicalismebook"
code = "https://gitlab.com/anarchymedialibertaire-group/anarcosyndicalismebook"
admindoc = "https://gitlab.com/anarchymedialibertaire-group/anarcosyndicalismebook/-/blob/main/README.md"

[integration]
yunohost = ">= 11.2.30"
helpers_version = "2.1"
architectures = "all"
multi_instance = true
ldap = false
sso = false
disk = "100M"
ram.build = "256M"
ram.runtime = "128M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

    [install.admin]
    type = "user"

    [install.admin_password]
    type = "password"

[resources]
    [resources.sources.main]
    url = "https://gitlab.com/anarchymedialibertaire-group/anarcosyndicalismebook/-/archive/main/anarcosyndicalismebook-main.tar.gz"
    sha256 = "95a5a97d23a250f68543bcc8ae8deaddbf570c541b0e533e5e57cc45d46c8335"
    autoupdate.strategy = "latest_gitlab_commit"
    autoupdate.upstream = "https://gitlab.com/anarchymedialibertaire-group/anarcosyndicalismebook"

    [resources.system_user]

    [resources.install_dir]

    [resources.data_dir]

    [resources.permissions]
    main.url = "/"
    admin.url = "/admin"
    admin.allowed = "admins"

    [resources.apt]
    packages = "mariadb-server, php8.2-mysql, php8.2-curl, php8.2-mbstring, php8.2-fileinfo, php8.2-sqlite3, php8.2-xml"

    [resources.database]
    type = "mysql"
