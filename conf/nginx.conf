location __PATH__/ {
    alias __INSTALL_DIR__/;

    index index.php;

    # Security headers
    more_set_headers "X-Frame-Options: SAMEORIGIN";
    more_set_headers "X-Content-Type-Options: nosniff";
    more_set_headers "X-XSS-Protection: 1; mode=block";
    more_set_headers "Referrer-Policy: strict-origin-when-cross-origin";
    
    # CSP Override: Clear upstream/default CSP and set permissive policy for EPUB/PDF
    more_clear_headers "Content-Security-Policy";
    more_set_headers "Content-Security-Policy: default-src 'self' data: blob: https: 'unsafe-inline' 'unsafe-eval'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob: https:; style-src 'self' 'unsafe-inline' blob: https: data:; font-src 'self' data: https:; img-src 'self' data: blob: https:; connect-src 'self' blob: https:; frame-src 'self' blob: data:; worker-src 'self' blob:;";

    # Protect sensitive directories
    location ~ ^__PATH__/(includes|vendor|backups)/ {
        deny all;
        return 404;
    }

    # Protect config files
    location ~ ^__PATH__/(database\.php|\.htaccess|\.user\.ini|composer\.(json|lock))$ {
        deny all;
        return 404;
    }

    # PHP handling
    location ~ [^/]\.php(/|$) {
        fastcgi_split_path_info ^(.+?\.php)(/.*)$;
        fastcgi_pass unix:/var/run/php/php__PHP_VERSION__-fpm-__APP__.sock;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param REMOTE_USER $remote_user;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param SCRIPT_FILENAME $request_filename;
    }

    # Static files caching
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # PDF and EPUB files
    location ~* \.(pdf|epub)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # Include SSOWAT panel
    include conf.d/yunohost_panel.conf.inc;
}
