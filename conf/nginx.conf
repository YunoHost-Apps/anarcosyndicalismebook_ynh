location __PATH__/ {
    alias __INSTALL_DIR__/;

    index index.php index.html;

    # Upload size limit (for bulk import)
    client_max_body_size 500M;

    # Security headers (CSP dynamique gérée par l'application PHP)
    more_set_headers "X-Frame-Options: SAMEORIGIN";
    more_set_headers "X-Content-Type-Options: nosniff";
    more_set_headers "Referrer-Policy: strict-origin-when-cross-origin";
    more_set_headers "Strict-Transport-Security: max-age=31536000; includeSubDomains";

    # Ne faire confiance qu'au proxy inverse local pour l'adresse cliente.
    set_real_ip_from 127.0.0.1;
    set_real_ip_from ::1;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # URL rewrites for clean URLs
    rewrite ^__PATH__/lire/([^/]+)/?$ __PATH__/lire.php?slug=$1 last;
    rewrite ^__PATH__/auteur/([^/]+)/?$ __PATH__/auteur.php?slug=$1 last;
    rewrite ^__PATH__/categorie/([^/]+)/?$ __PATH__/categorie.php?slug=$1 last;
    rewrite ^__PATH__/page/([^/]+)/?$ __PATH__/page.php?slug=$1 last;
    rewrite ^__PATH__/(offline|hors-ligne)/?$ __PATH__/offline.html last;

    # Protect sensitive directories
    location ~ ^__PATH__/(docker|includes|sql|vendor|backups|tools-restricted|admin/config|logs|cache|api/temp_migration)/ {
        deny all;
        return 404;
    }

    # Deny direct script execution in uploads
    location ~ ^__PATH__/uploads/.*\.(php|phtml|sh|py|pl|cgi)$ {
        deny all;
        return 404;
    }

    # Protect config files
    location ~ ^__PATH__/(database\.php|\.htaccess|\.user\.ini|composer\.(json|lock)|\.git) {
        deny all;
        return 404;
    }

    # Fallback to .php for clean URLs without .php extension (ex: /soumettre, /connexion, /catalogue)
    try_files $uri $uri/ @php_rewrite;

    # PHP handling
    location ~ [^/]\.php(/|$) {
        fastcgi_split_path_info ^(.+?\.php)(/.*)$;
        fastcgi_pass unix:/var/run/php/php__PHP_VERSION__-fpm-__APP__.sock;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param REMOTE_USER $remote_user;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param SCRIPT_FILENAME $request_filename;
    }

    # Static files caching & wasm support
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|wasm)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # PDF and EPUB files
    location ~* \.(pdf|epub)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Include SSOWAT panel
    include conf.d/yunohost_panel.conf.inc;
}

location @php_rewrite {
    rewrite ^__PATH__/(.*)$ __PATH__/$1.php?$args last;
}
