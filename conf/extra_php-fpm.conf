; Appended by ynh_config_add_phpfpm to the auto-generated pool configuration.
; upload_max_filesize, post_max_size and memory_limit are driven by the
; php_upload_max_filesize and php_memory_limit app settings (see scripts).

php_admin_value[max_execution_time] = 300

php_admin_flag[log_errors] = on
php_admin_flag[display_errors] = off
php_admin_flag[display_startup_errors] = off
