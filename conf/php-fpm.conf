[__APP__]
user = __APP__
group = www-data
listen = /var/run/php/php__PHP_VERSION__-fpm-__APP__.sock
listen.owner = www-data
listen.group = www-data

pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 5
pm.max_requests = 500

request_terminate_timeout = 300s

php_admin_value[error_log] = /var/log/php/fpm-__APP__.log
php_admin_flag[log_errors] = on

; PHP settings
php_value[upload_max_filesize] = 100M
php_value[post_max_size] = 500M
php_value[max_execution_time] = 300
php_value[memory_limit] = 256M

; Security
php_admin_value[open_basedir] = __INSTALL_DIR__/:__DATA_DIR__/:/tmp/:/var/tmp/
php_admin_value[session.save_path] = /var/lib/php/sessions
php_admin_flag[expose_php] = off

; Force PHP extensions required by the application
; This ensures zip, gd and sqlite3 are active even if not globally enabled for this PHP version
php_admin_value[extension] = zip
